<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================== 基础场景 ============================== */
const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9eef2);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.05, 120);
camera.position.set(3, 17, 21);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
container.appendChild(labelRenderer.domElement);

/* ============================== 灯光 ============================== */
scene.add(new THREE.HemisphereLight(0xffffff, 0xd4dce6, 0.85));
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const sun = new THREE.DirectionalLight(0xfff3df, 1.7);
sun.position.set(14, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-18; sun.shadow.camera.right=18;
sun.shadow.camera.top=18; sun.shadow.camera.bottom=-18;
sun.shadow.camera.far=70; sun.shadow.bias=-0.0004;
scene.add(sun);
// 室内补光（每层中部，弱）
const indoorLights=[];
[[0,4.5],[3.2,4.5],[6.2,4.5],[-3,4.5]].forEach(([y,z],i)=>{
  const p = new THREE.PointLight(0xffffff, i===3?1.3:.55, 16, 0);
  p.position.set(3, y+2.4, z); scene.add(p); indoorLights.push(p);
});
// 车库南侧（采光井下）额外补光
const pg = new THREE.PointLight(0xffffff,1.0,12,0); pg.position.set(1.5,-3,2); scene.add(pg);

/* ============================== 材质 ============================== */
// 地板纹理（三套）
function floorTexture(base, line, plank=true, grain=false){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,256,256);
  if(plank){
    x.strokeStyle=line; x.lineWidth=1.4;
    for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,i*64);x.lineTo(256,i*64);x.stroke();}
    x.globalAlpha=.7;
    for(let r=0;r<4;r++){const off=(r%2)*128;
      for(let i=0;i<2;i++){const xx=off+i*128;x.beginPath();x.moveTo(xx,r*64);x.lineTo(xx,(r+1)*64);x.stroke();}}
    x.globalAlpha=1;
    if(grain){
      x.strokeStyle='rgba(120,80,40,.18)';x.lineWidth=1;
      for(let r=0;r<4;r++)for(let k=0;k<5;k++){
        const y=r*64+8+k*11+Math.random()*4;
        x.beginPath();x.moveTo(0,y);
        for(let xx=0;xx<=256;xx+=16) x.lineTo(xx,y+Math.sin(xx*.15+k)*2.2);
        x.stroke();}
    }
  } else { // 大砖
    x.strokeStyle=line; x.lineWidth=2;
    for(let i=0;i<=2;i++){
      x.beginPath();x.moveTo(i*128,0);x.lineTo(i*128,256);x.stroke();
      x.beginPath();x.moveTo(0,i*128);x.lineTo(256,i*128);x.stroke();}
    x.strokeStyle='rgba(255,255,255,.04)';x.lineWidth=1;
    for(let i=0;i<60;i++){const xx=Math.random()*256,yy=Math.random()*256;
      x.beginPath();x.moveTo(xx,yy);x.lineTo(xx+Math.random()*40,yy+Math.random()*8);x.stroke();}
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
// 家具木纹（原木风）
function woodGrainTexture(){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#c99a64'; x.fillRect(0,0,256,256);
  for(let k=0;k<22;k++){
    const y=k*12+Math.random()*6;
    x.strokeStyle=`rgba(${90+Math.random()*40|0},${55+Math.random()*30|0},25,${.10+Math.random()*.14})`;
    x.lineWidth=.8+Math.random()*1.2;
    x.beginPath();x.moveTo(0,y);
    for(let xx=0;xx<=256;xx+=12) x.lineTo(xx,y+Math.sin(xx*.12+k)*2.6);
    x.stroke();}
  // 几个节疤
  for(let k=0;k<4;k++){
    const xx=40+Math.random()*180,yy=40+Math.random()*180;
    x.strokeStyle='rgba(80,45,20,.25)';
    for(let r=4;r<14;r+=3){x.beginPath();x.ellipse(xx,yy,r,r*.5,0,0,7);x.stroke();}}
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const texFloorCream = floorTexture('#ece4d3','rgba(150,130,100,.30)',true,false);
const texFloorWood  = floorTexture('#dcb98a','rgba(120,85,45,.34)',true,true);
const texFloorDark  = floorTexture('#34373c','rgba(15,17,20,.55)',false,false);
const texGrain      = woodGrainTexture();
const texFloor = texFloorCream;

const matWall    = new THREE.MeshStandardMaterial({color:0xf6f5f1, roughness:.92});
const matSlab    = new THREE.MeshStandardMaterial({map:texFloor, color:0xffffff, roughness:.85});
const matCeil    = new THREE.MeshStandardMaterial({color:0xffffff, roughness:.95});
const matDoor    = new THREE.MeshStandardMaterial({color:0xddc9a3, roughness:.7});
const matFrame   = new THREE.MeshStandardMaterial({color:0xf2f2ee, roughness:.6});
const matGlass   = new THREE.MeshPhysicalMaterial({color:0xbcd6e8, transparent:true, opacity:.30, roughness:.08,
                     metalness:0, side:THREE.DoubleSide, depthWrite:false});
const matRoof    = new THREE.MeshStandardMaterial({color:0x6d6860, roughness:.88, side:THREE.DoubleSide});
const matSofa    = new THREE.MeshStandardMaterial({color:0xd8d0c0, roughness:.95});
const matPillow  = new THREE.MeshStandardMaterial({color:0xece7dc, roughness:.95});
const matWood    = new THREE.MeshStandardMaterial({color:0xc3a884, roughness:.75});
const matMattress= new THREE.MeshStandardMaterial({color:0xe9e3d5, roughness:.95});
const matCabinet = new THREE.MeshStandardMaterial({color:0xe3d9c7, roughness:.8});
const matCounter = new THREE.MeshStandardMaterial({color:0xf1ede4, roughness:.5});
const matAppliance=new THREE.MeshStandardMaterial({color:0xe7e7e3, roughness:.5, metalness:.1});
const matMetal   = new THREE.MeshStandardMaterial({color:0x8d949c, roughness:.5, metalness:.5});
const matTV      = new THREE.MeshStandardMaterial({color:0x1d1f22, roughness:.4});
const matCar     = new THREE.MeshStandardMaterial({color:0x9fb5ca, roughness:.5, metalness:.25});
const matLeaf    = new THREE.MeshStandardMaterial({color:0x7fa76e, roughness:.9});
const matGrass   = new THREE.MeshStandardMaterial({color:0x88a878, roughness:1});
const matPaving  = new THREE.MeshStandardMaterial({color:0xb6b4ad, roughness:.95});
const matNeighbor= new THREE.MeshStandardMaterial({color:0xdadada, roughness:1});
const matRamp    = new THREE.MeshStandardMaterial({color:0xa8a69f, roughness:.9});
const matDark    = new THREE.MeshStandardMaterial({color:0x4a4d52, roughness:.8});
const matTub     = new THREE.MeshStandardMaterial({color:0xf3f1ec, roughness:.4});

// 外立面（不随室内风格变化）
const matFacade  = new THREE.MeshStandardMaterial({color:0xefece3, roughness:.96});
const matPlinth  = new THREE.MeshStandardMaterial({color:0xb3ab9a, roughness:.92});
const matBand    = new THREE.MeshStandardMaterial({color:0xd8d1c1, roughness:.9});
const matAccent  = new THREE.MeshStandardMaterial({color:0xb08a5e, roughness:.72});
// 窗帘（随风格变色）
const matCurtain = new THREE.MeshStandardMaterial({color:0xf3ead9, roughness:1,
                     transparent:true, opacity:.55, side:THREE.DoubleSide});

/* ============================== 通用几何 ============================== */
function box(sx,sy,sz,x,y,z,mat,parent=scene,cast=true,receive=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=receive;
  parent.add(m); return m;
}
function cyl(r,h,x,y,z,mat,seg=20,parent=scene){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  parent.add(m); return m;
}

/* ---------- 墙体（带门洞/窗洞，自动登记碰撞） ---------- */
const colliders=[];
function wallH(z,x0,x1,y0,y1,thick,mat){
  if(x1-x0<0.03) return;
  box(x1-x0,y1-y0,thick,(x0+x1)/2,(y0+y1)/2,z,mat);
  colliders.push({x0,z0:z-thick/2,x1,z1:z+thick/2,y0,y1});
}
function wallV(x,z0,z1,y0,y1,thick,mat){
  if(z1-z0<0.03) return;
  box(thick,y1-y0,z1-z0,x,(y0+y1)/2,(z0+z1)/2,mat);
  colliders.push({x0:x-thick/2,z0,x1:x+thick/2,z1,y0,y1});
}
// 洞口：{a,b,sill,head,glass}  a/b=水平起止，sill/head=竖直起止（绝对标高）
function finishOpeningH(z,o){
  const len=o.b-o.a, hh=o.head-o.sill;
  if(o.glass) box(len,hh,.025,(o.a+o.b)/2,(o.sill+o.head)/2,z,matGlass,scene,false,false);
  // 窗框/门框
  box(len,.08,.1,(o.a+o.b)/2,o.head-.04,z,matFrame);
  box(.08,hh,.1,o.a+.04,(o.sill+o.head)/2,z,matFrame);
  box(.08,hh,.1,o.b-.04,(o.sill+o.head)/2,z,matFrame);
  if(o.glass && len>.9) box(.05,hh,.09,(o.a+o.b)/2,(o.sill+o.head)/2,z,matFrame);
}
function finishOpeningV(x,o){
  const len=o.b-o.a, hh=o.head-o.sill;
  if(o.glass) box(.025,hh,len,x,(o.sill+o.head)/2,(o.a+o.b)/2,matGlass,scene,false,false);
  box(.1,.08,len,x,o.head-.04,(o.a+o.b)/2,matFrame);
  box(.1,hh,.08,x,(o.sill+o.head)/2,o.a+.04,matFrame);
  box(.1,hh,.08,x,(o.sill+o.head)/2,o.b-.04,matFrame);
  if(o.glass && len>.9) box(.09,hh,.05,x,(o.sill+o.head)/2,(o.a+o.b)/2,matFrame);
}
function wallHOpen(z,r0,r1,floor,h,thick,mat,ops=[]){
  const sorted=[...ops].sort((p,q)=>p.a-q.a); let cur=r0;
  for(const o of sorted){
    if(o.a>cur) wallH(z,cur,o.a,floor,h,thick,mat);
    if(o.sill>floor+.02) wallH(z,o.a,o.b,floor,o.sill,thick,mat);
    if(o.head<h-.02) wallH(z,o.a,o.b,o.head,h,thick,mat);
    finishOpeningH(z,o);
    cur=o.b;
  }
  if(r1>cur) wallH(z,cur,r1,floor,h,thick,mat);
}
function wallVOpen(x,r0,r1,floor,h,thick,mat,ops=[]){
  const sorted=[...ops].sort((p,q)=>p.a-q.a); let cur=r0;
  for(const o of sorted){
    if(o.a>cur) wallV(x,cur,o.a,floor,h,thick,mat);
    if(o.sill>floor+.02) wallV(x,o.a,o.b,floor,o.sill,thick,mat);
    if(o.head<h-.02) wallV(x,o.a,o.b,o.head,h,thick,mat);
    finishOpeningV(x,o);
    cur=o.b;
  }
  if(r1>cur) wallV(x,cur,r1,floor,h,thick,mat);
}

/* ---------- 楼板（带洞口，轴网分解） ---------- */
function slab(x0,z0,x1,z1,y,thick,mat,holes=[]){
  const xs=[x0,x1], zs=[z0,z1];
  holes.forEach(h=>{xs.push(h.x0,h.x1);zs.push(h.z0,h.z1);});
  const ux=[...new Set(xs.map(v=>+v.toFixed(3)))].sort((a,b)=>a-b);
  const uz=[...new Set(zs.map(v=>+v.toFixed(3)))].sort((a,b)=>a-b);
  for(let i=0;i<ux.length-1;i++)for(let j=0;j<uz.length-1;j++){
    const ax=ux[i],bx=ux[i+1],az=uz[j],bz=uz[j+1],cx=(ax+bx)/2,cz=(az+bz)/2;
    let inside=false;
    for(const h of holes) if(cx>h.x0&&cx<h.x1&&cz>h.z0&&cz<h.z1){inside=true;break;}
    if(!inside&&bx-ax>.02&&bz-az>.02) box(bx-ax,thick,bz-az,cx,y+thick/2,cz,mat);
  }
}

/* ============================== 楼梯（三跑） ============================== */
const stairPts=[];
function rememberFlight(x0,z0,x1,z1,y0,y1){
  const n=14;
  for(let i=0;i<=n;i++){const t=i/n;
    stairPts.push({x:x0+(x1-x0)*t, z:z0+(z1-z0)*t, y:y0+(y1-y0)*t});}
}
function rememberLanding(x0,z0,x1,z1,y){
  for(let x=x0;x<=x1+.01;x+=.35)for(let z=z0;z<=z1+.01;z+=.35) stairPts.push({x,z,y});
}
// 直跑梯（水平方向任意），n=踏步数（riser数），w=梯宽
function straightStair(x0,z0,x1,z1,y0,y1,n,w){
  const dx=x1-x0, dz=z1-z0, L=Math.hypot(dx,dz);
  const g=new THREE.Group();
  g.position.set(x0,0,z0);
  g.rotation.y=Math.atan2(dx,dz);   // 局部 +Z 对齐梯段方向
  const td=L/n, rise=(y1-y0)/n;
  // 两根斜梯梁
  const slope=Math.atan2(y1-y0,L);
  [-w/2,w/2].forEach(off=>{
    const s=box(.08,.08,L,off,(y0+y1)/2,L/2,matMetal,g);
    s.rotation.x=-slope;
  });
  for(let i=1;i<=n;i++){
    box(w,.05,td,0,y0+i*rise-.025,(i-.5)*td,matFrame,g);   // 踏面
    box(w,rise,.03,0,y0+(i-.5)*rise,i*td,matFrame,g);      // 踢面
  }
  scene.add(g);
  rememberFlight(x0,z0,x1,z1,y0,y1);
}

// 井道参数（X4.0-5.85，Z5.45-8.1）
const SX0=4.0, SX1=5.85, SZ0=5.45, SZ1=8.1;
const LAz=5.72, LBz=7.88, Lx0=4.18, Lx1=5.62;   // 两条E-W跑的位置

function triFloorStair(fy,ty){
  const total=ty-fy, per=total/3;
  // 跑1：南侧，向东
  straightStair(Lx0,LAz,Lx1,LAz,fy,fy+per,7,.78);
  rememberLanding(5.45,5.45,5.85,6.02,fy+per);           // SE 转角平台
  // 跑2：东侧，向北
  straightStair(Lx1,6.02,Lx1,7.58,fy+per,fy+2*per,7,.78);
  rememberLanding(5.45,7.58,5.85,8.1,fy+2*per);          // NE 转角平台
  // 跑3：北侧，向西
  straightStair(Lx1,LBz,Lx0,LBz,fy+2*per,ty,7,.78);
  rememberLanding(4.0,7.58,4.4,8.1,ty);                  // NW 到达平台
  // 楼层平台（西南入口）
  rememberLanding(4.0,5.45,4.6,6.02,fy);
}

/* ---------- 车库→一层 折返梯（标高 -6→-3.4→-1.9→-0.7→0） ---------- */
function garageStair(){
  // -6 → -4.7 → -3.4（两跑折返）
  straightStair(Lx0,LAz,Lx1,LAz,-6,-4.7,8,.78);
  rememberLanding(5.45,5.45,5.85,LBz,-4.7);
  straightStair(Lx1,LBz,Lx0,LBz,-4.7,-3.4,8,.78);
  rememberLanding(4.0,7.0,5.85,8.2,-3.4);   // -3.400 休息平台（约1200深）
  // -3.4 → -2.65 → -1.9
  straightStair(Lx0,LAz,Lx1,LAz,-3.4,-2.65,5,.78);
  rememberLanding(5.45,5.45,5.85,LBz,-2.65);
  straightStair(Lx1,LBz,Lx0,LBz,-2.65,-1.9,5,.78);
  rememberLanding(4.0,7.58,4.4,8.1,-1.9);
  // -1.9 → -1.3 → -0.7
  straightStair(Lx0,LAz,Lx1,LAz,-1.9,-1.3,4,.78);
  rememberLanding(5.45,5.45,5.85,LBz,-1.3);
  straightStair(Lx1,LBz,Lx0,LBz,-1.3,-0.7,4,.78);
  rememberLanding(4.0,7.58,4.4,8.1,-0.7);
  // -0.7 → 0（短跑，接入一层西南楼层平台）

// 窗套（H墙，洞口沿X；sign=外凸方向）
function surroundH(z,a,b,sill,head,sign,mat=matBand){
  const zz=z+sign*.075, t=.1, d=.12;
  box(b-a+2*t,t,d,(a+b)/2,head+t/2,zz,mat);
  box(b-a+2*t,t,d,(a+b)/2,sill-t/2,zz,mat);
  box(t,head-sill+2*t,d,a-t/2,(sill+head)/2,zz,mat);
  box(t,head-sill+2*t,d,b+t/2,(sill+head)/2,zz,mat);
}
// 窗套（V墙，洞口沿Z）
function surroundV(x,a,b,sill,head,sign,mat=matBand){
  const xx=x+sign*.075, t=.1, d=.12;
  box(d,t,b-a+2*t,xx,head+t/2,(a+b)/2,mat);
  box(d,t,b-a+2*t,xx,sill-t/2,(a+b)/2,mat);
  box(d,head-sill+2*t,t,xx,(sill+head)/2,a-t/2,mat);
  box(d,head-sill+2*t,t,xx,(sill+head)/2,b+t/2,mat);
}

const PLAYER_R=.28;

function collide(x,z,y){
  for(const c of colliders){
    if(y<c.y0-.15||y>c.y1+.15) continue;
    if(x>c.x0-PLAYER_R&&x<c.x1+PLAYER_R&&z>c.z0-PLAYER_R&&z<c.z1+PLAYER_R) return true;
  }
  return false;
}
function stairHeightAt(x,z,by0){
  let best=1e9,by=null;
  for(const p of stairPts){
    if(Math.abs(p.y-by0)>1.9) continue;
    const s=(p.x-x)**2+(p.z-z)**2 + Math.abs(p.y-by0)*.06;
    if(s<best){best=s;by=p.y;}
  }
  // 最终仍要求水平距离足够近
  let hd=1e9;
  for(const p of stairPts){ if(Math.abs(p.y-by0)>1.9)continue;
    const d=(p.x-x)**2+(p.z-z)**2; if(d<hd)hd=d; }
  return hd<.42?by:null;
}
// 室外场地地面标高（返回 null 表示在建筑室内）
function outsideGround(x,z,by){
  // F2 挑空阳台
  if(x>.35&&x<3.1&&z>.45&&z<1.35&&by>3&&by<4) return 3.5;
  // F3 露台
  if(x>.2&&x<5.85&&z>7.6&&z<10.9&&by>6.5) return 7.2;
  if(z<1.35) return -.7;
  if(x<.1||x>5.9) return -.7;
  if(z>10.92){
    if(x>.3&&x<5.7){
      if(z<=13) return -6;
      if(z<20) return -6+(z-13)/7*1.6;
      return -4.4;
    }
    return -3.7;
  }
  return null;
}

// 渐变引擎
const tweens=[];
function smooth(k){return k*k*(3-2*k);}
function addTween(dur,onUpdate){ tweens.push({t:0,dur,onUpdate}); }
function tweenMat(mat,s){
  const c0=mat.color.clone(), r0=mat.roughness, m0=mat.metalness, o0=mat.opacity;
  const c1=(s.color!==undefined)?new THREE.Color(s.color):null;
  let swapped=false;
  addTween(.8,k=>{
    if(c1) mat.color.copy(c0).lerp(c1,k);
    if(s.roughness!==undefined) mat.roughness=r0+(s.roughness-r0)*k;
    if(s.metalness!==undefined) mat.metalness=m0+(s.metalness-m0)*k;
    if(s.opacity!==undefined) mat.opacity=o0+(s.opacity-o0)*k;
    if(s.map!==undefined&&!swapped&&k>=.5){ mat.map=s.map; mat.needsUpdate=true; swapped=true; }
  });
}
function applyStyle(id){
  const s=STYLES[id];
  tweenMat(matWall,{color:s.wall,roughness:s.wallR});
  tweenMat(matSlab,{color:0xffffff,map:s.floorTex});
  tweenMat(matCeil,{color:s.ceil});
  tweenMat(matDoor,{color:s.door});
  tweenMat(matFrame,s.frame);
  tweenMat(matGlass,s.glass);
  tweenMat(matSofa,{color:s.sofa,roughness:s.sofaR});
  tweenMat(matPillow,{color:s.pillow});
  tweenMat(matMattress,{color:s.bedding});
  tweenMat(matWood,s.wood);
  tweenMat(matCabinet,s.cabinet);
  tweenMat(matCounter,{color:s.counter});
  tweenMat(matAppliance,{color:s.appliance});
  tweenMat(matMetal,s.metal);
  tweenMat(matTub,{color:s.tub});
  tweenMat(matCurtain,s.curtain);
  indoorLights.forEach((l,i)=>{
    const v0=l.intensity, v1=s.lights[i];
    addTween(.8,k=>{l.intensity=v0+(v1-v0)*k;});
  });
  const g0=pg.intensity;
  addTween(.8,k=>{pg.intensity=g0+(s.garageLight-g0)*k;});
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt;
    tw.onUpdate(smooth(Math.min(1,tw.t/tw.dur)));
    if(tw.t>=tw.dur) tweens.splice(i,1);
  }

  if(mode==='fps'&&fps.isLocked){
    const speed=(keys['ShiftLeft']||keys['ShiftRight'])?5.5:3.0;
    dir.z=(keys['KeyW']?1:0)-(keys['KeyS']?1:0);
    dir.x=(keys['KeyD']?1:0)-(keys['KeyA']?1:0);
    const fwd=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,camera.rotation.y,0));
    const right=new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,camera.rotation.y,0));
    const wish=new THREE.Vector3().addScaledVector(fwd,dir.z).addScaledVector(right,dir.x);
    if(wish.lengthSq()>0) wish.normalize().multiplyScalar(speed);
    vel.x+=(wish.x-vel.x)*Math.min(1,12*dt);
    vel.z+=(wish.z-vel.z)*Math.min(1,12*dt);

    const pos=camera.position;
    let nx=pos.x+vel.x*dt;
    if(!collide(nx,pos.z,baseY)) pos.x=nx; else vel.x=0;
    let nz=pos.z+vel.z*dt;
    if(!collide(pos.x,nz,baseY)) pos.z=nz; else vel.z=0;
    pos.x=Math.max(-1.5,Math.min(7.5,pos.x));

    // 楼梯自动升降
    const sy=stairHeightAt(pos.x,pos.z,baseY);
    if(sy!==null){
      baseY=sy; noMatch=0;
      pos.y=sy+eyeH;
    } else {
      const g=outsideGround(pos.x,pos.z,baseY);
      if(g!==null){ baseY=g; noMatch=0; }
      else {
        noMatch+=dt;
        const levels=[-6,0,3.2,3.5,6.2,7.2];
        const onLevel=levels.some(f=>Math.abs(f-baseY)<.25);
        if(!onLevel&&noMatch>.35){
          baseY=levels.reduce((b,f)=>Math.abs(f-baseY)<Math.abs(b-baseY)?f:b,levels[0]);
          noMatch=0;
        }
      }
      pos.y=baseY+eyeH;
    }
  }

  if(mode==='orbit') orbit.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
  resolveLabels();
}
animate();

// 标签自动避让：屏幕上重叠时，只保留离相机最近的
function resolveLabels(){
  if(!labelsOn) return;
  const items=labelItems.map(it=>({it,
     depth:camera.position.distanceToSquared(it.obj.position),
     dy:Math.abs(it.obj.position.y-camera.position.y),
     rect:it.el.getBoundingClientRect()}));
  items.sort((a,b)=>a.depth-b.depth);
  const shown=[];
  for(const q of items){
    const r=q.rect;
    if(q.dy>2.4){ q.it.el.style.visibility='hidden'; continue; }
    let hit=false;
    for(const s of shown){
      if(!(r.right<s.left-4||r.left>s.right+4||r.bottom<s.top-4||r.top>s.bottom+4)){hit=true;break;}
    }
    q.it.el.style.visibility=hit?'hidden':'visible';
    if(!hit) shown.push(r);
  }
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  labelRenderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
